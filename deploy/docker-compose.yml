# Run the whole IEaaS stack on any machine or cloud VM:
#   docker compose -f deploy/docker-compose.yml up --build
# Dashboard: http://localhost:3000    API docs: http://localhost:8000/api/py/docs
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data          # persistent DuckDB files
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
